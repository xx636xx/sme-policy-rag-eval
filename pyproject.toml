[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-policy-rag-eval"
version = "0.1.0"
description = "Grounded compliance Q&A, hybrid retrieval (BM25 + TF-IDF + RRF), abstention gating, and automated RAG evaluation harness for SME ISO 27001 and workplace safety policies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Alejandro Montejo de Luna"}
]
dependencies = [
    "numpy>=2.0.0",
    "pydantic>=2.10.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
sme-policy-rag-eval = "sme_policy_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
